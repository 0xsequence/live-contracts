name: "trails-pdas-prod/uniswap-v3-adapter-100"
version: "1"
description: "Deploy the Trails PDAs Uniswap v3 adapter pinned to the 1bps fee tier Everlong routes through"
depends_on: ["era-evm-predeploy-erc2470"]
# TODO: lift with the rest of the prod stack when it goes live. Anvil-only until then, so the
# local README run deploys the job and no real network does. Katana-scoped: Everlong is
# Katana-only.
only_networks: [31337]


min_evm_version: "cancun"

constants:
  # UniswapV3Adapter is pinned to a single fee tier baked into the constructor, so this
  # deployment only routes through the chosen tier's pools. Changing the value changes the
  # adapter address on every chain.
  trails-pdas-uniswap-v3-fee: "100"

actions:
  - name: "trails-pdas-uniswap-v3-adapter"
    template: "erc-2470"
    skip_condition:
      - type: "value-empty"
        arguments:
          value:
            type: "read-json"
            arguments:
              json: "{{trails-pdas-uniswap-v3-factory}}"
              path: "{{Network().chainId}}"
      - type: "value-empty"
        arguments:
          value:
            type: "read-json"
            arguments:
              json: "{{trails-pdas-wrapped-native}}"
              path: "{{Network().chainId}}"
    arguments:
      salt: "{{salt-zero}}"
      creationCode:
        type: "constructor-encode"
        arguments:
          creationCode: "{{Contract(../trails-pdas/build-info/pdas-1/UniswapV3Adapter.json:UniswapV3Adapter).creationCode}}"
          types: ["address", "address", "uint24"]
          values:
            - type: "read-json"
              arguments:
                json: "{{trails-pdas-uniswap-v3-factory}}"
                path: "{{Network().chainId}}"
            - type: "read-json"
              arguments:
                json: "{{trails-pdas-wrapped-native}}"
                path: "{{Network().chainId}}"
            - "{{trails-pdas-uniswap-v3-fee}}"
    output: true

  - name: "verify-trails-pdas-uniswap-v3-adapter"
    type: "verify-contract"
    depends_on: ["trails-pdas-uniswap-v3-adapter"]
    skip_condition:
      - type: "value-empty"
        arguments:
          value:
            type: "read-json"
            arguments:
              json: "{{trails-pdas-uniswap-v3-factory}}"
              path: "{{Network().chainId}}"
      - type: "value-empty"
        arguments:
          value:
            type: "read-json"
            arguments:
              json: "{{trails-pdas-wrapped-native}}"
              path: "{{Network().chainId}}"
    arguments:
      address: "{{trails-pdas-uniswap-v3-adapter.address}}"
      contract: "{{Contract(../trails-pdas/build-info/pdas-1/UniswapV3Adapter.json:UniswapV3Adapter)}}"
      constructorArguments:
        type: "constructor-encode"
        arguments:
          types: ["address", "address", "uint24"]
          values:
            - type: "read-json"
              arguments:
                json: "{{trails-pdas-uniswap-v3-factory}}"
                path: "{{Network().chainId}}"
            - type: "read-json"
              arguments:
                json: "{{trails-pdas-wrapped-native}}"
                path: "{{Network().chainId}}"
            - "{{trails-pdas-uniswap-v3-fee}}"
    output: false
