name: "trails-pdas-prod/layerzero-adapter"
version: "1"
description: "Deploy the Trails PDAs LayerZero adapter (Cancun transient-storage variant)"
depends_on: ["era-evm-predeploy-erc2470", "trails-pdas-prod/configurator"]
# TODO: remove once testing is done. Limits Trails PDAs deploys to Optimism, Polygon and Base;
# 31337 keeps the local Anvil run that generates the README table.
only_networks: [10, 137, 8453, 31337]
min_evm_version: "cancun"

# TODO: remove once trails-pdas-prod-owner-address is set. Skipped while the owner is the
# address(0) placeholder, so the README table run and CI deploys do not fail on the revert.
skip_condition:
  - type: "basic-arithmetic"
    arguments:
      operation: "eq"
      values: ["{{trails-pdas-prod-owner-address}}", "{{address-zero}}"]

actions:
  - name: "trails-pdas-layerzero-adapter"
    template: "erc-2470"
    arguments:
      salt: "{{salt-zero}}"
      creationCode:
        type: "constructor-encode"
        arguments:
          creationCode: "{{Contract(../trails-pdas/build-info/pdas-1/LayerZeroAdapter.json:LayerZeroAdapter).creationCode}}"
          types: ["address"]
          values: ["{{trails-pdas-prod/configurator.trails-pdas-configurator.address}}"]
    output: true

  - name: "verify-trails-pdas-layerzero-adapter"
    type: "verify-contract"
    depends_on: ["trails-pdas-layerzero-adapter"]
    arguments:
      address: "{{trails-pdas-layerzero-adapter.address}}"
      contract: "{{Contract(../trails-pdas/build-info/pdas-1/LayerZeroAdapter.json:LayerZeroAdapter)}}"
      constructorArguments:
        type: "constructor-encode"
        arguments:
          types: ["address"]
          values: ["{{trails-pdas-prod/configurator.trails-pdas-configurator.address}}"]
    output: false
