name: "trails-pdas-dev/rollout-0002-relay-corridors"
version: "1"
description: "Redeem the Trails PDAs dev Relay corridor rollout on each chain's Configurator"
depends_on:
  - "trails-pdas-dev-owner"
  - "trails-pdas-dev/configurator"
  - "trails-pdas-dev/relay-adapter"
# TODO: remove once testing is done. Limits Trails PDAs deploys to Optimism, Polygon and Base;
# 31337 keeps the local Anvil run that generates the README table.
only_networks: [10, 137, 42161, 8453, 31337]
min_evm_version: "cancun"

actions:
  # Sets the Relay corridors on each chain's Relay adapter, at nonce 1 (after the bootstrap
  # rollout): the native->native mesh across all 17 Relay chains, MON (Monad's native, the
  # zero address) -> USDC out of Monad to every chain with a canonical USDC, native SOMI to
  # Somnia (Relay lists no USDC there), and USDC -> MON inbound on every chain with a USDC.
  # USDC addresses are Relay's canonical listings (api.relay.link/chains?resolve=true).
  # See ./rollouts/0002-relay-corridors.spec.json.
  #
  # Redeems this chain's leaf from the signed root in ./rollouts/0002-relay-corridors.constants.yaml.
  # Skipped once the Configurator's nonce has moved past the leaf, which is also how a second run
  # is a no-op. The owner wallet must be deployed on the chain for its signature to validate.
  # Catapult expands a template only when it is the whole string, so each per-chain value is two
  # nested lookups: the chain's entry under `leaves`, then the field within it.
  - name: "rollout-0002-relay-corridors"
    template: "send-transaction"
    skip_condition:
      # Chains outside the rollout have no leaf, including the local chain the README table deploys to.
      - type: "value-empty"
        arguments:
          value:
            type: "read-json"
            arguments:
              json:
                type: "read-json"
                arguments:
                  json: "{{trails-pdas-dev-rollout-0002-relay-corridors}}"
                  path: "leaves"
              path: "{{Network().chainId}}"
      - type: "basic-arithmetic"
        arguments:
          operation: "gt"
          values:
            - type: "call"
              arguments:
                to: "{{trails-pdas-dev/configurator.trails-pdas-configurator.address}}"
                signature: "nonce() returns (uint256)"
                values: []
            - type: "read-json"
              arguments:
                json:
                  type: "read-json"
                  arguments:
                    json:
                      type: "read-json"
                      arguments:
                        json: "{{trails-pdas-dev-rollout-0002-relay-corridors}}"
                        path: "leaves"
                    path: "{{Network().chainId}}"
                path: "leaf.2"
    arguments:
      to: "{{trails-pdas-dev/configurator.trails-pdas-configurator.address}}"
      value: "0"
      data:
        type: "abi-encode"
        arguments:
          signature: "updateConfig(bytes32,(uint256,address,uint256,(address,bytes)[]),bytes32[],bytes)"
          values:
            - type: "read-json"
              arguments:
                json: "{{trails-pdas-dev-rollout-0002-relay-corridors}}"
                path: "root"
            - type: "read-json"
              arguments:
                json:
                  type: "read-json"
                  arguments:
                    json:
                      type: "read-json"
                      arguments:
                        json: "{{trails-pdas-dev-rollout-0002-relay-corridors}}"
                        path: "leaves"
                    path: "{{Network().chainId}}"
                path: "leaf"
            - type: "read-json"
              arguments:
                json:
                  type: "read-json"
                  arguments:
                    json:
                      type: "read-json"
                      arguments:
                        json: "{{trails-pdas-dev-rollout-0002-relay-corridors}}"
                        path: "leaves"
                    path: "{{Network().chainId}}"
                path: "proof"
            - type: "read-json"
              arguments:
                json: "{{trails-pdas-dev-rollout-0002-relay-corridors}}"
                path: "signature"
    output: false
