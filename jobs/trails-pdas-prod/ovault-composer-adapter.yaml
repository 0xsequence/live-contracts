name: "trails-pdas-prod/ovault-composer-adapter"
version: "1"
description: "Deploy the Trails PDAs OVault composer adapter (Cancun transient-storage variant)"
depends_on: ["era-evm-predeploy-erc2470", "trails-pdas-prod/configurator"]
min_evm_version: "cancun"

# TODO: remove once trails-pdas-prod-owner-address is set. Skipped while the owner is the
# address(0) placeholder, so the README table run and CI deploys do not fail on the revert.
skip_condition:
  - type: "basic-arithmetic"
    arguments:
      operation: "eq"
      values: ["{{trails-pdas-prod-owner-address}}", "{{address-zero}}"]

actions:
  - name: "trails-pdas-ovault-composer-adapter"
    template: "erc-2470"
    arguments:
      salt: "{{salt-zero}}"
      creationCode:
        type: "constructor-encode"
        arguments:
          creationCode: "{{Contract(../trails-pdas/build-info/pdas-1/OVaultComposerAdapter.json:OVaultComposerAdapter).creationCode}}"
          types: ["address"]
          values: ["{{trails-pdas-prod/configurator.trails-pdas-configurator.address}}"]
    output: true

  - name: "verify-trails-pdas-ovault-composer-adapter"
    type: "verify-contract"
    depends_on: ["trails-pdas-ovault-composer-adapter"]
    arguments:
      address: "{{trails-pdas-ovault-composer-adapter.address}}"
      contract: "{{Contract(../trails-pdas/build-info/pdas-1/OVaultComposerAdapter.json:OVaultComposerAdapter)}}"
      constructorArguments:
        type: "constructor-encode"
        arguments:
          types: ["address"]
          values: ["{{trails-pdas-prod/configurator.trails-pdas-configurator.address}}"]
    output: false
