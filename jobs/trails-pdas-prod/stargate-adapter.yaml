name: "trails-pdas-prod/stargate-adapter"
version: "1"
description: "Deploy the Trails PDAs Stargate adapter (Cancun transient-storage variant)"
depends_on: ["era-evm-predeploy-erc2470", "developer-multisig", "trails-pdas-prod/configurator"]
# TODO: remove when the prod stack is ready to go live. Anvil only until then, so the local
# README run deploys the jobs and no real network does.
only_networks: [31337]
min_evm_version: "cancun"


actions:
  - name: "trails-pdas-stargate-adapter"
    template: "erc-2470"
    arguments:
      salt: "{{salt-zero}}"
      creationCode:
        type: "constructor-encode"
        arguments:
          creationCode: "{{Contract(../trails-pdas/build-info/pdas-1/StargateAdapter.json:StargateAdapter).creationCode}}"
          types: ["address"]
          values: ["{{trails-pdas-prod/configurator.trails-pdas-configurator.address}}"]
    output: true

  - name: "verify-trails-pdas-stargate-adapter"
    type: "verify-contract"
    depends_on: ["trails-pdas-stargate-adapter"]
    arguments:
      address: "{{trails-pdas-stargate-adapter.address}}"
      contract: "{{Contract(../trails-pdas/build-info/pdas-1/StargateAdapter.json:StargateAdapter)}}"
      constructorArguments:
        type: "constructor-encode"
        arguments:
          types: ["address"]
          values: ["{{trails-pdas-prod/configurator.trails-pdas-configurator.address}}"]
    output: false
