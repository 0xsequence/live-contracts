name: "trails-pdas-dev/ovault-composer-adapter"
version: "1"
description: "Deploy the Trails PDAs OVault composer adapter (Cancun transient-storage variant)"
depends_on: ["era-evm-predeploy-erc2470", "trails-pdas-dev/configurator"]
min_evm_version: "cancun"

actions:
  - name: "trails-pdas-ovault-composer-adapter"
    template: "erc-2470"
    arguments:
      salt: "{{salt-zero}}"
      creationCode:
        type: "constructor-encode"
        arguments:
          creationCode: "{{Contract(./build-info/pdas-1/OVaultComposerAdapter.json:OVaultComposerAdapter).creationCode}}"
          types: ["address"]
          values: ["{{trails-pdas-dev/configurator.trails-pdas-configurator.address}}"]
    output: true

  - name: "verify-trails-pdas-ovault-composer-adapter"
    type: "verify-contract"
    depends_on: ["trails-pdas-ovault-composer-adapter"]
    arguments:
      address: "{{trails-pdas-ovault-composer-adapter.address}}"
      contract: "{{Contract(./build-info/pdas-1/OVaultComposerAdapter.json:OVaultComposerAdapter)}}"
      constructorArguments:
        type: "constructor-encode"
        arguments:
          types: ["address"]
          values: ["{{trails-pdas-dev/configurator.trails-pdas-configurator.address}}"]
    output: false
