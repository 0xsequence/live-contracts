name: "trails-pdas-prod/fee-adapter"
version: "1"
description: "Deploy the Trails PDAs fee adapter (Cancun transient-storage variant)"
depends_on: ["era-evm-predeploy-erc2470"]
# TODO: remove once testing is done. Limits Trails PDAs deploys to Optimism, Polygon and Base;
# 31337 keeps the local Anvil run that generates the README table.
only_networks: [10, 137, 8453, 31337]
min_evm_version: "cancun"


actions:
  - name: "trails-pdas-fee-adapter"
    # TODO: remove once trails-pdas-prod-owner-address is set. Skipped on the deployable networks
    # while the owner is the address(0) placeholder; the local Anvil run reads the stand-in owner
    # from trails-pdas-prod-owner in constants.yaml, so it deploys and the README table gets its row.
    skip_condition:
      - type: "basic-arithmetic"
        arguments:
          operation: "eq"
          values:
            - type: "read-json"
              arguments:
                json: "{{trails-pdas-prod-owner}}"
                path: "{{Network().chainId}}"
            - "{{address-zero}}"
    template: "erc-2470"
    arguments:
      salt: "{{salt-zero}}"
      creationCode:
        type: "constructor-encode"
        arguments:
          creationCode: "{{Contract(../trails-pdas/build-info/pdas-1/FeeAdapter.json:FeeAdapter).creationCode}}"
          types: ["address"]
          values:
            - type: "read-json"
              arguments:
                json: "{{trails-pdas-prod-owner}}"
                path: "{{Network().chainId}}"
    output: true

  - name: "verify-trails-pdas-fee-adapter"
    # TODO: remove once trails-pdas-prod-owner-address is set. Skipped on the deployable networks
    # while the owner is the address(0) placeholder; the local Anvil run reads the stand-in owner
    # from trails-pdas-prod-owner in constants.yaml, so it deploys and the README table gets its row.
    skip_condition:
      - type: "basic-arithmetic"
        arguments:
          operation: "eq"
          values:
            - type: "read-json"
              arguments:
                json: "{{trails-pdas-prod-owner}}"
                path: "{{Network().chainId}}"
            - "{{address-zero}}"
    type: "verify-contract"
    depends_on: ["trails-pdas-fee-adapter"]
    arguments:
      address: "{{trails-pdas-fee-adapter.address}}"
      contract: "{{Contract(../trails-pdas/build-info/pdas-1/FeeAdapter.json:FeeAdapter)}}"
      constructorArguments:
        type: "constructor-encode"
        arguments:
          types: ["address"]
          values:
            - type: "read-json"
              arguments:
                json: "{{trails-pdas-prod-owner}}"
                path: "{{Network().chainId}}"
    output: false
