name: "safe-singleton-factory"
version: "1"
type: "template"
description: "Deploy a contract through Safe's canonical singleton factory"

arguments:
  creationCode:
    type: "bytes"
    description: "Creation code of the contract to deploy"

returns:
  address:
    type: "address"
    description: "Canonical zero-salt CREATE2 address"

# The Safe singleton factory normally already exists on supported networks. The
# signed transaction below is Safe's official EIP-155 deployment for chain 31337,
# which keeps local validation self-contained.
setup:
  skip_condition:
    - type: "contract-exists"
      arguments:
        address: "0x914d7Fec6aaC8cd542e72Bca78B30650d45643d7"
  actions:
    - type: "min-balance"
      arguments:
        address: "0xE1CB04A0fA36DdD16a06ea828007E35e1a3cBC37"
        balance: "10000000000000000"
    - type: "send-signed-transaction"
      arguments:
        transaction: ""

actions:
  - type: "assured-deployment"
    arguments:
      targetAddress:
        type: "compute-create2"
        arguments:
          deployerAddress: "0x914d7Fec6aaC8cd542e72Bca78B30650d45643d7"
          salt: "{{salt-zero}}"
          initCode: "{{creationCode}}"
      factoryAddress: "0x914d7Fec6aaC8cd542e72Bca78B30650d45643d7"
      callData:
        type: "abi-pack"
        arguments:
          types: ["bytes32", "bytes"]
          values: ["{{salt-zero}}", "{{creationCode}}"]

skip_condition:
  - type: "contract-exists"
    arguments:
      address:
        type: "compute-create2"
        arguments:
          deployerAddress: "0x914d7Fec6aaC8cd542e72Bca78B30650d45643d7"
          salt: "{{salt-zero}}"
          initCode: "{{creationCode}}"

outputs:
  address:
    type: "compute-create2"
    arguments:
      deployerAddress: "0x914d7Fec6aaC8cd542e72Bca78B30650d45643d7"
      salt: "{{salt-zero}}"
      initCode: "{{creationCode}}"
