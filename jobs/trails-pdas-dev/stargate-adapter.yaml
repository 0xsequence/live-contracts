name: "trails-pdas-dev/stargate-adapter"
version: "1"
description: "Deploy the Trails PDAs Stargate adapter (Cancun transient-storage variant)"
depends_on: ["era-evm-predeploy-erc2470", "trails-pdas-dev-owner", "trails-pdas-dev/configurator"]
min_evm_version: "cancun"

actions:
  - name: "trails-pdas-stargate-adapter"
    template: "erc-2470"
    arguments:
      salt: "{{salt-zero}}"
      creationCode:
        type: "constructor-encode"
        arguments:
          creationCode: "{{Contract(./build-info/pdas-1/StargateAdapter.json:StargateAdapter).creationCode}}"
          types: ["address"]
          values: ["{{trails-pdas-dev/configurator.trails-pdas-configurator.address}}"]
    output: true

  - name: "verify-trails-pdas-stargate-adapter"
    type: "verify-contract"
    depends_on: ["trails-pdas-stargate-adapter"]
    arguments:
      address: "{{trails-pdas-stargate-adapter.address}}"
      contract: "{{Contract(./build-info/pdas-1/StargateAdapter.json:StargateAdapter)}}"
      constructorArguments:
        type: "constructor-encode"
        arguments:
          types: ["address"]
          values: ["{{trails-pdas-dev/configurator.trails-pdas-configurator.address}}"]
    output: false
