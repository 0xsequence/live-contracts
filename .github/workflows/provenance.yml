name: Provenance

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - "jobs/**/build-info/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - ".github/workflows/provenance.yml"

permissions:
  contents: read

concurrency:
  group: provenance-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  verify:
    name: "Verify build-info provenance"
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Verify provenance
        run: pnpm run provenance
