name: "trails-pdas-prod/signed-swap-oracle"
version: "1"
description: "Deploy the Trails PDAs signed swap oracle"
depends_on: ["era-evm-predeploy-erc2470", "trails-pdas-prod/configurator"]
# TODO: remove once testing is done. Limits Trails PDAs deploys to Optimism, Polygon and Base;
# 31337 keeps the local Anvil run that generates the README table.
only_networks: [10, 137, 8453, 31337]
min_evm_version: "cancun"

constants:
  # TODO: set to the production trails-api oracle signer. address(0) is a placeholder: the
  # SignedSwapOracle constructor reverts on it, so nothing deploys until it is replaced. It is a
  # constructor argument, so changing it moves the oracle on every chain.
  trails-pdas-prod-oracle-signer: "0x0000000000000000000000000000000000000000"

# TODO: remove once trails-pdas-prod-owner-address is set. Skipped while the owner is the
# address(0) placeholder, so the README table run and CI deploys do not fail on the revert.
skip_condition:
  - type: "basic-arithmetic"
    arguments:
      operation: "eq"
      values: ["{{trails-pdas-prod-owner-address}}", "{{address-zero}}"]

actions:
  # Signed oracle used by the router to value route balance deltas. Admin is the Configurator and
  # the initial signer set holds SIGNER_ROLE. Both constructor arguments are chain-invariant, so
  # the address is the same on every chain.
  - name: "trails-pdas-signed-swap-oracle"
    template: "erc-2470"
    arguments:
      salt: "{{salt-zero}}"
      creationCode:
        type: "constructor-encode"
        arguments:
          creationCode: "{{Contract(../trails-pdas/build-info/pdas-1/SignedSwapOracle.json:SignedSwapOracle).creationCode}}"
          types: ["address", "address[]"]
          values:
            - "{{trails-pdas-prod/configurator.trails-pdas-configurator.address}}"
            - ["{{trails-pdas-prod-oracle-signer}}"]
    output: true

  - name: "verify-trails-pdas-signed-swap-oracle"
    type: "verify-contract"
    depends_on: ["trails-pdas-signed-swap-oracle"]
    arguments:
      address: "{{trails-pdas-signed-swap-oracle.address}}"
      contract: "{{Contract(../trails-pdas/build-info/pdas-1/SignedSwapOracle.json:SignedSwapOracle)}}"
      constructorArguments:
        type: "constructor-encode"
        arguments:
          types: ["address", "address[]"]
          values:
            - "{{trails-pdas-prod/configurator.trails-pdas-configurator.address}}"
            - ["{{trails-pdas-prod-oracle-signer}}"]
    output: false
