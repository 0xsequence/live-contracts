name: "trails-pdas-dev/fee-adapter"
version: "1"
description: "Deploy the Trails PDAs fee adapter (Cancun transient-storage variant)"
depends_on: ["era-evm-predeploy-erc2470"]
min_evm_version: "cancun"

actions:
  - name: "trails-pdas-fee-adapter"
    template: "erc-2470"
    arguments:
      salt: "{{salt-zero}}"
      creationCode:
        type: "constructor-encode"
        arguments:
          creationCode: "{{Contract(./build-info/pdas-1/FeeAdapter.json:FeeAdapter).creationCode}}"
          types: ["address"]
          values: ["{{trails-pdas-dev-owner-address}}"]
    output: true

  - name: "verify-trails-pdas-fee-adapter"
    type: "verify-contract"
    depends_on: ["trails-pdas-fee-adapter"]
    arguments:
      address: "{{trails-pdas-fee-adapter.address}}"
      contract: "{{Contract(./build-info/pdas-1/FeeAdapter.json:FeeAdapter)}}"
      constructorArguments:
        type: "constructor-encode"
        arguments:
          types: ["address"]
          values: ["{{trails-pdas-dev-owner-address}}"]
    output: false
