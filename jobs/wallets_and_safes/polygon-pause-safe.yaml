name: "polygon-pause-safe"
version: "1"
description: "Deploy Polygon's pause Safe at its canonical cross-chain address"
min_evm_version: "prague"

# Safe's canonical singleton factory is not available on these SKALE networks.
skip_networks: [37084624, 324705682, 1482601649]

constants:
  polygon-pause-safe-address: "0x9d851f8b8751c5FbC09b9E74E6e68E9950949052"
  # Original Safe initializer, reconstructed from the canonical deployments on
  # Ethereum, Polygon, and Sepolia. It starts as 1-of-5; later owner/threshold
  # changes are chain-specific Safe transactions and are not replayable.
  polygon-pause-safe-initializer: ""

actions:
  - name: "safe-singleton-1-4-1"
    template: "safe-singleton-factory"
    arguments:
      creationCode: "{{Contract(./build-info/safe-1.4.1/safe-1.4.1.json:Safe).creationCode}}"
    output: true

  - name: "safe-l2-singleton-1-4-1"
    depends_on: ["safe-singleton-1-4-1"]
    template: "safe-singleton-factory"
    arguments:
      creationCode: "{{Contract(./build-info/safe-1.4.1/safe-1.4.1.json:SafeL2).creationCode}}"
    output: true

  - name: "safe-proxy-factory-1-4-1"
    depends_on: ["safe-l2-singleton-1-4-1"]
    template: "safe-singleton-factory"
    arguments:
      creationCode: "{{Contract(./build-info/safe-1.4.1/safe-1.4.1.json:SafeProxyFactory).creationCode}}"
    output: true

  - name: "safe-fallback-handler-1-4-1"
    depends_on: ["safe-proxy-factory-1-4-1"]
    template: "safe-singleton-factory"
    arguments:
      creationCode: "{{Contract(./build-info/safe-1.4.1/safe-1.4.1.json:CompatibilityFallbackHandler).creationCode}}"
    output: true

  - name: "safe-to-l2-setup-1-4-1"
    depends_on: ["safe-fallback-handler-1-4-1"]
    template: "safe-singleton-factory"
    arguments:
      creationCode: "{{Contract(./build-info/safe-1.4.1/safe-1.4.1.json:SafeToL2Setup).creationCode}}"
    output: true

  - name: "polygon-pause-safe"
    depends_on:
      - "safe-singleton-1-4-1"
      - "safe-l2-singleton-1-4-1"
      - "safe-proxy-factory-1-4-1"
      - "safe-fallback-handler-1-4-1"
      - "safe-to-l2-setup-1-4-1"
    skip_condition:
      - type: "contract-exists"
        arguments:
          address: "{{polygon-pause-safe-address}}"
    template: "assured-deployment"
    arguments:
      targetAddress: "{{polygon-pause-safe-address}}"
      factoryAddress: "{{safe-proxy-factory-1-4-1.address}}"
      callData:
        type: "abi-encode"
        arguments:
          signature: "createProxyWithNonce(address,bytes,uint256)"
          values:
            - "{{safe-singleton-1-4-1.address}}"
            - "{{polygon-pause-safe-initializer}}"
            - "0"
    output:
      address: "{{polygon-pause-safe-address}}"
